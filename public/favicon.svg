<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0c0e14" />
  <!-- Geodesic & Tensegrity Star Geometry -->
  <polygon points="50,14 84,34 84,74 50,92 16,74 16,34" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.6" />
  <polygon points="50,22 78,72 22,72" fill="none" stroke="url(#cyanGrad)" stroke-width="3" />
  <polygon points="50,78 22,28 78,28" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8" />
  <!-- Center equilibrium node -->
  <circle cx="50" cy="50" r="6" fill="url(#goldGrad)" />
  <circle cx="50" cy="50" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
  <line x1="50" y1="22" x2="50" y2="78" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
</svg>